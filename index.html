  <script>
    // Toast Notification System
    window.showToast = function(msg, type) {
      if (!msg) return;
      var str = String(msg);
      if (str.includes('Recovered') || str.includes('Browser Memory') || str.includes('Cloud Database')) return;
      var container = document.getElementById('app-toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'app-toast-container';
        container.style.cssText = 'position:fixed; top:20px; right:20px; z-index:9999999; display:flex; flex-direction:column; gap:8px; pointer-events:none; max-width:360px;';
        document.body ? document.body.appendChild(container) : document.documentElement.appendChild(container);
      }
      // Limit to max 3 toasts on screen at once
      if (container.children.length >= 3) {
        container.removeChild(container.firstChild);
      }
      var isError = type === 'error' || str.toLowerCase().includes('fail') || str.toLowerCase().includes('error');
      var toast = document.createElement('div');
      toast.style.cssText = 'padding:12px 20px; border-radius:8px; font-family:Inter,sans-serif; font-size:13px; font-weight:600; color:white; background:' + (isError ? '#dc2626' : '#10b981') + '; box-shadow:0 10px 25px -5px rgba(0,0,0,0.4); transition:all 0.3s ease; transform:translateY(-10px); opacity:0; pointer-events:auto; display:flex; align-items:center; gap:8px;';
      toast.innerHTML = (isError ? '⚠️ ' : '✅ ') + str;
      container.appendChild(toast);
      setTimeout(function() {
        toast.style.transform = 'translateY(0)';
        toast.style.opacity = '1';
      }, 10);
      setTimeout(function() {
        toast.style.transform = 'translateY(-10px)';
        toast.style.opacity = '0';
        setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
      }, 3500);
    };

    // Override native browser alert to block modal dialog popups permanently
    window.alert = function(msg) {
      if (!msg) return;
      var str = String(msg);
      if (str.includes('Recovered') || str.includes('Browser Memory') || str.includes('Cloud Database')) return;
      console.log('[Alert Suppressed]:', str);
      window.showToast(str);
    };

    // Invalidate and clear old PWA ServiceWorker cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
      });
    }
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("JavaScript Error: " + message + " | Line: " + lineno);
      return true;
    };
  </script>

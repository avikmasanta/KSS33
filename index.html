<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="KSS - Professional Construction Material Inventory & Site Management System">
  <title>KSS | Construction Materials Inventory</title>

  <!-- PWA Meta & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KSS App">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    window.onerror = function(message, source, lineno, colno, error) {
      alert("JavaScript Error: " + message + "\nSource: " + source + "\nLine: " + lineno);
      return false;
    };
  </script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css?v=3">
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/components.css?v=24">
  <link rel="stylesheet" href="css/layout.css?v=5">
  <link rel="stylesheet" href="css/pages.css?v=3">
  <link rel="stylesheet" href="css/responsive.css?v=1">
  <style>
    @keyframes db-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <!-- Cloud DB Connection Loader Overlay -->
  <div id="db-loader-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999999; color: white; transition: opacity 0.4s ease, visibility 0.4s;">
    <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
      <div style="position: absolute; width: 80px; height: 80px; border-radius: 50%; background: rgba(59, 130, 246, 0.15); animation: pulse 2s infinite ease-in-out;"></div>
      <div style="width: 56px; height: 56px; border: 4px solid rgba(255,255,255,0.05); border-top-color: #3b82f6; border-right-color: #60a5fa; border-radius: 50%; animation: db-spin 0.85s linear infinite;"></div>
    </div>
    <div style="font-family: 'Outfit', 'Inter', sans-serif; font-size: 1.15rem; font-weight: 500; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">Connecting to cloud database...</div>
    <div style="font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #64748b; margin-top: 8px;">Syncing materials, sites, and dispatches</div>
  </div>

  <!-- App Root -->
  <div id="app-root"></div>

  <!-- JavaScript -->
  <script src="js/icons.js?v=8"></script>
  <script src="js/store.js?v=100"></script>
  <script src="js/auth.js?v=10"></script>
  <script src="js/dashboard.js?v=8"></script>
  <script src="js/sites2.js?v=25"></script>
  <script src="js/products.js?v=15"></script>
  <script src="js/incoming.js?v=11"></script>
  <script src="js/outgoing.js?v=9"></script>
  <script src="js/site-details2.js?v=31"></script>
  <script src="js/inventory.js?v=12"></script>
  <script src="js/ledger.js?v=9"></script>
  <script src="js/reports.js?v=100"></script>
  <script src="js/returns.js?v=8"></script>
  <script src="js/rentals.js?v=1"></script>
  <script src="js/separateBilling.js?v=21"></script>
  <script src="js/labour.js?v=8"></script>
  <script src="js/app.js?v=15"></script>
</body>
</html>
